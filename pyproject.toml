[tool.poetry]
name = "arcaflow-plugin-sdk"
# Do not change, the version is automatically updated in CI.
version = "0.0.0"
description = "Plugin SDK for Python for the Arcaflow workflow engine"
authors = ["Arcalot Contributors"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "arcaflow_plugin_sdk", from = "src"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
homepage = "https://github.com/arcalot/arcaflow-plugin-sdk-python"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/arcalot/arcaflow-plugin-sdk-python/issues"

[tool.poetry.dependencies]
python = "^3.12"
cbor2 = "~6.1.0"
PyYAML = "~6.0.1"

[tool.poetry.group.dev.dependencies]
coverage = "7.14.1"
html2text = "2024.2.26"
pre-commit = "3.8.0"
sphinx = "7.4.7"
sphinx-rtd-theme = "2.0.0"
isort = "5.13.2"
black = "24.10.0"
autoflake = "2.3.3"
docformatter = "1.7.8"
flake8 = "7.3.0"
autopep8 = "2.3.2"
pytest-repeat = "0.9.4"

[tool.isort]
profile = 'black'

[tool.docformatter]
recursive = true
wrap-summaries = 79
wrap-descriptions = 79


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
